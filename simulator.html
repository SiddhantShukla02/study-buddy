<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBuddy on Alexa+ (simulator)</title>
<style>
:root{--bg:#0e1621;--panel:#16212f;--line:#263548;--ink:#e8eef6;--dim:#8fa3b8;--ring:#27c3ff;--me:#1d3a57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;
display:grid;grid-template-columns:1fr 340px;height:100vh}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:1fr 220px}}
main{display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.ring{width:34px;height:34px;border-radius:50%;border:4px solid var(--ring);box-shadow:0 0 14px var(--ring);flex:none}
.ring.busy{animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.ring.busy{animation:none}}
h1{font-size:18px;margin:0;font-weight:600}header span{color:var(--dim);font-size:13px}
#log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(520px,85%);padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.a{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.u{background:var(--me);align-self:flex-end;border-top-right-radius:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 10px}
.chips button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.chips button:hover,.chips button:focus-visible{border-color:var(--ring);color:var(--ink);outline:none}
form{display:flex;gap:10px;padding:14px 22px 22px;border-top:1px solid var(--line)}
input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
input:focus-visible{outline:2px solid var(--ring)}
form button{background:var(--ring);color:#04202e;border:0;border-radius:12px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
aside{border-left:1px solid var(--line);background:#0b121b;display:flex;flex-direction:column;min-height:0}
aside h2{font-size:14px;margin:0;padding:18px 18px 10px;color:var(--dim);font-weight:600}
#trace{flex:1;overflow:auto;padding:0 18px 18px;font:12px/1.5 ui-monospace,Menlo,monospace}
.t{border-left:3px solid var(--ring);padding:2px 0 2px 10px;margin-bottom:12px}
.t b{color:var(--ring)}.t pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.badge{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:4px 12px;white-space:nowrap}
.badge.live{color:var(--ring);border-color:var(--ring)}
.tools{display:flex;gap:8px;padding:0 22px 10px;flex-wrap:wrap}
.tools button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.tools button[aria-pressed=true]{border-color:var(--ring);color:var(--ink)}
.tools button:hover,.tools button:focus-visible{border-color:var(--ring);color:var(--ink);outline:none}
.warn{color:#ffb454;font:13px/1.4 "Segoe UI",system-ui,sans-serif;margin:0 0 12px}
.empty{color:var(--dim);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
</style></head><body>
<main>
<header><div class="ring" id="ring"></div><div><h1>StudyBuddy</h1><span>Simulated Alexa+. Every tool call goes over real MCP to /mcp</span></div><div class="badge" id="badge" role="status">checking...</div></header>
<div id="log"><div class="m a">Hi, I'm StudyBuddy. Ask for a quiz, save your own flashcards, get a revision plan, or check your progress.</div></div>
<div class="chips" id="chips"></div>
<div class="tools"><button type="button" id="mic" aria-pressed="false">Mic: off</button><button type="button" id="spk" aria-pressed="false">Speak replies: off</button><button type="button" id="new">New learner</button></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Say something to Alexa..." aria-label="Message"><button>Send</button></form>
</main>
<aside><h2>MCP tool calls</h2><div id="trace"><p class="empty">Tool calls the server handles will appear here.</p></div></aside>
<script>
const log=document.getElementById('log'),trace=document.getElementById('trace'),ring=document.getElementById('ring'),
 badge=document.getElementById('badge'),mic=document.getElementById('mic'),spk=document.getElementById('spk');
let session;
try{session=localStorage.getItem('sb-session')}catch(e){}
if(!session){session=Math.random().toString(36).slice(2,12);try{localStorage.setItem('sb-session',session)}catch(e){}}
const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return ''}})();
const add=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.append(d);log.scrollTop=log.scrollHeight};
let speak=false;
function say(t){if(speak&&'speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
["Quiz me on biology","Remember that mitosis is cell division","Quiz me","How am I doing?","Plan 4 days for math","Add a task to read chapter 5","What's on my list?",
 "Make flashcards from: Osmosis is the movement of water across a membrane. Diffusion is the spread of particles from high to low concentration."].forEach(s=>{
 const b=document.createElement('button');b.type='button';b.textContent=s.length>40?s.slice(0,37)+'...':s;b.title=s;b.onclick=()=>send(s);chips.append(b)});
fetch('/api/health').then(r=>r.json()).then(h=>{
 badge.textContent=h.agent==='bedrock'?'LLM agent: Amazon Bedrock':'Keyword mode (no LLM configured)';badge.classList.toggle('live',h.agent==='bedrock')
}).catch(()=>{badge.textContent='server unreachable'});
function showCalls(j){
 if(j.note){const w=document.createElement('p');w.className='warn';w.textContent=j.note;if(trace.querySelector('.empty'))trace.innerHTML='';trace.append(w)}
 if(j.calls.length&&trace.querySelector('.empty'))trace.innerHTML='';
 j.calls.forEach(c=>{const d=document.createElement('div');d.className='t';
  d.innerHTML='<b></b><pre></pre>';d.querySelector('b').textContent=c.tool+'('+Object.entries(c.args).map(([k,v])=>k+'='+JSON.stringify(v)).join(', ')+')';
  d.querySelector('pre').textContent=JSON.stringify(c.result,null,1);trace.append(d)});
 trace.scrollTop=trace.scrollHeight}
async function send(text){
 if(!text.trim())return;add('u',text);ring.classList.add('busy');
 try{
  const r=await fetch('/api/utter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,session,tz})});
  const j=await r.json();add('a',j.say);say(j.say);showCalls(j);
  if(j.mode==='agent'){badge.textContent='LLM agent: Amazon Bedrock';badge.classList.add('live')}
 }catch(e){add('a','Could not reach the server. Is it still running?')}
 ring.classList.remove('busy')}
f.onsubmit=e=>{e.preventDefault();const v=q.value;q.value='';send(v)};
spk.onclick=()=>{speak=!speak;spk.setAttribute('aria-pressed',speak);spk.textContent='Speak replies: '+(speak?'on':'off');if(!speak&&'speechSynthesis' in window)speechSynthesis.cancel()};
document.getElementById('new').onclick=()=>{try{localStorage.removeItem('sb-session')}catch(e){}location.reload()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.disabled=true;mic.textContent='Mic: not supported in this browser'}
else{const rec=new SR();rec.lang='en-US';rec.interimResults=false;
 rec.onresult=e=>{send(e.results[0][0].transcript)};
 rec.onend=()=>{mic.setAttribute('aria-pressed','false');mic.textContent='Mic: off'};
 rec.onerror=()=>{mic.setAttribute('aria-pressed','false');mic.textContent='Mic: off'};
 mic.onclick=()=>{try{rec.start();mic.setAttribute('aria-pressed','true');mic.textContent='Listening...'}catch(e){}}}
</script></body></html>
